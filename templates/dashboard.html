<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Ringkasan Saldo</title>
</head>
<body style="font-family: Arial, sans-serif; margin: 40px;">
    <h1>Dashboard Ringkasan Keuangan</h1>
    <p>Versi Aplikasi: {{ versi }}</p>

    <div style="border: 1px solid #000; padding: 20px; max-width: 400px;">
        <h3>Detail:</h3>
        <p style="color: green;">Total Pemasukan: Rp {{ masuk }}</p>
        <p style="color: red;">Total Pengeluaran: Rp {{ keluar }}</p>
        <hr>
        <!-- Nilai saldo ini mengandung bug dari backend -->
        <h2>Saldo Saat Ini: Rp {{ saldo }}</h2> 
    </div>
    
    <br>
    <a href="/">Kembali ke Home</a>
</body>
</html>
