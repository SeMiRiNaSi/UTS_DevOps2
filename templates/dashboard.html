<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Ringkasan Saldo</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            color: #1f2937;
        }

        .container {
            max-width: 900px;
            margin: 60px auto;
            padding: 0 20px;
        }

        .header {
            margin-bottom: 30px;
        }

        .header h1 {
            margin: 0 0 8px;
            font-size: 32px;
            color: #111827;
        }

        .header p {
            margin: 0;
            color: #6b7280;
            font-size: 15px;
        }

        .dashboard {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        .dashboard-title {
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 20px;
            color: #374151;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .card {
            padding: 22px;
            border-radius: 12px;
            background: #f9fafb;
            border: 1px solid #e5e7eb;
        }

        .card-title {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 10px;
        }

        .card-value {
            margin: 0;
            font-size: 23px;
            font-weight: bold;
        }

        .income {
            color: #16a34a;
        }

        .expense {
            color: #dc2626;
        }

        .balance {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            padding: 28px;
            border-radius: 14px;
        }

        .balance-label {
            margin: 0 0 10px;
            font-size: 14px;
            opacity: 0.85;
        }

        .balance-value {
            margin: 0;
            font-size: 32px;
            font-weight: bold;
        }

        .back {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 20px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 14px;
            transition: 0.2s;
        }

        .back:hover {
            background: #1d4ed8;
        }

        @media (max-width: 600px) {
            .container {
                margin: 30px auto;
            }

            .header h1 {
                font-size: 26px;
            }

            .dashboard {
                padding: 20px;
            }

            .cards {
                grid-template-columns: 1fr;
            }

            .balance-value {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>Dashboard Keuangan</h1>
            <p>Ringkasan kondisi keuangan Anda</p>
        </div>

        <div class="dashboard">

            <h2 class="dashboard-title">Ringkasan Saldo</h2>

            <div class="cards">

                <div class="card">
                    <div class="card-title">Total Pemasukan</div>
                    <p class="card-value income">
                        Rp {{ masuk }}
                    </p>
                </div>

                <div class="card">
                    <div class="card-title">Total Pengeluaran</div>
                    <p class="card-value expense">
                        Rp {{ keluar }}
                    </p>
                </div>

            </div>

            <div class="balance">
                <p class="balance-label">Saldo Saat Ini</p>
                <p class="balance-value">
                    Rp {{ saldo }}
                </p>
            </div>

            <a href="/" class="back">
                ← Kembali ke Home
            </a>

        </div>

    </div>

</body>
</html>
